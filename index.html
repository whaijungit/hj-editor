<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="基于 Tiptap 3 与 React 19 构建的富文本编辑器" />
    <title>写作家</title>
    <script>
      // 首屏就应用主题，避免深色主题刷新时闪白
      ;(function () {
        try {
          var raw = localStorage.getItem('hj-editor:theme-config:v1')
          var config = raw ? JSON.parse(raw) : null
          var mode = config && config.mode
          if (!mode) {
            mode =
              localStorage.getItem('hj-editor:theme:v1') === 'dark'
                ? 'dark'
                : 'light'
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
          if (!config) return
          if (config.preset) root.dataset.themePreset = config.preset
          if (/^#[0-9a-f]{6}$/i.test(config.accent || '')) {
            root.dataset.themeAccent = 'custom'
            root.style.setProperty('--accent', config.accent)
          }
          var stacks = {
            'system-sans': 'var(--font-sans)',
            'system-serif': 'var(--font-serif)',
            'noto-serif': '"Noto Serif SC", var(--font-serif)',
            'noto-sans': '"Noto Sans SC", var(--font-sans)',
            'lxgw-wenkai': '"LXGW WenKai TC", var(--font-serif)',
            'zcool-xiaowei': '"ZCOOL XiaoWei", var(--font-serif)',
            sans: 'var(--font-sans)',
            serif: 'var(--font-serif)',
          }
          var stack = stacks[config.bodyFont]
          if (stack) root.style.setProperty('--body-font', stack)
          if (typeof config.bodyFontSize === 'number') {
            root.style.setProperty(
              '--body-font-size',
              config.bodyFontSize + 'px',
            )
          }
          if (typeof config.bodyLineHeight === 'number') {
            root.style.setProperty(
              '--body-line-height',
              String(config.bodyLineHeight),
            )
          }
        } catch (error) {
          /* 忽略隐私模式下的存储访问失败 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
